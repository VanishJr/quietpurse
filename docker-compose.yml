services:
  backend:
    build: ./backend
    container_name: finto-backend
    restart: unless-stopped
    # Change the left side if the backend should listen elsewhere on the host;
    # PORT inside the container stays 4000.
    ports:
      - "4000:4000"
    # NOTE: the file must exist (create an empty one if you have no secrets) -
    # older docker compose versions cannot mark an env_file as optional.
    env_file:
      - ./backend/.env
    environment:
      # inside the compose network the DB host is the service name, not localhost.
      # POSTGRES_PASSWORD comes from the .env next to this file; the dev default
      # keeps `docker compose up` working on a laptop, and the backend refuses to
      # start on it under NODE_ENV=production (see assertProductionConfig).
      DATABASE_URL: postgres://finto:${POSTGRES_PASSWORD:-finto}@postgres:5432/finto
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Enable Banking private key (EB_PRIVATE_KEY_PATH=./secrets/enablebanking.pem).
      - ./backend/secrets:/app/secrets:ro
      # The uploaded statements themselves (DOCUMENT_STORE_PATH, ROADMAP 4.5). A
      # named volume, not a bind mount: a host directory arrives root-owned and the
      # image runs as USER node. Without it every stored statement is erased by the
      # next `up --force-recreate`, and silently - the database still says the
      # document is there. Mounted at exactly the config default, so the path is
      # written down in one place.
      - documents:/app/data/documents

  postgres:
    image: postgres:16-alpine
    container_name: finto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finto}
      POSTGRES_DB: finto
    # Exposed to the host so `npm run dev` outside Docker reaches the same DB.
    # Loopback only: plain "5432:5432" publishes on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finto -d finto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  documents:
