name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # runs even when typecheck failed: one install, two independent signals,
      # instead of a red PR that hides whatever the tests would have said
      - run: npm test
        if: always()

  backend-postgres:
    name: backend (tests on real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # 16-alpine: the server version the DATABASE_URL path is held against, since the
      # embedded engine the product runs on is exercised by the job above.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finto
          POSTGRES_PASSWORD: finto
          # the suite truncates every table it connects to and refuses a database
          # not named for the purpose (test/pglite.ts)
          POSTGRES_DB: finto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finto -d finto_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # no typecheck here: the job above already ran it, and this one exists for
      # the behaviour PGlite cannot reach - one connection means it never sees a
      # unique index lose a race, or two writers meet
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://finto:finto@localhost:5432/finto_test

  web:
    name: web (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `npm run build` type-checks too, but as its first half: a type error would
      # report as a build failure. Split so the checklist says which one broke.
      - run: npm run typecheck
      # two projects, one command: the pure functions in node, plus jsdom screen
      # tests for the App shell, Overview and CsvImport. Still no browser - layout,
      # styles.css, downloads and charts are outside jsdom and stay manual, and
      # every other screen is mounted by the App test and asserted about by nothing.
      - run: npm test
        if: always()
      - run: npm run build
        if: always()
