<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- One value and no media query, although this page has two schemes where
         landing.html has one. What `theme-color` colours is the strip of browser
         chrome directly above the window, so the only question it answers is what
         is at the TOP of this page — and that is dark whichever scheme is on: the
         `.ov-band` bar, which runs #010710 flat from the left edge in light mode and
         #10161f in dark. The page BEHIND it is near-white in light mode, and it is
         not what is under the address bar.

         A media query would also be answering the wrong question. The scheme this app
         paints in is not `prefers-color-scheme` — theme.tsx lets it be pinned, and
         remembers the pin in localStorage — so a pair of `media=` tags would follow the
         OS while the window followed the button, and be wrong for exactly the readers
         who chose. Six units of lightness between the two bands is not worth buying
         that with. -->
    <meta name="theme-color" content="#010710" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Finto</title>
    <meta
      name="description"
      content="Finto: a personal finance tracker for money that lives in more than one currency."
    />
    <!-- This page is the application, served from a person's own machine: there is
         nothing here for a crawler. The public page is landing.html, which asks to
         be indexed. -->
    <meta name="robots" content="noindex, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
